<!DOCTYPE html>
<html lang="pt-BR">
<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>
(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });
      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();
</script><script>window.Intl=window.Intl||{};Intl.t=function(s){return(Intl._locale&&Intl._locale[s])||s;};</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diamante Vivo - Motor Spritesheet</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050810;--panel:#0c1424;--cyan:#00e5ff;--violet:#7b5cff;--amber:#ffb300;--success:#00e676;--danger:#ff3d5a;--glass:rgba(120,180,255,0.06);--border:rgba(0,229,255,0.28);--text:#eaf6ff;--dim:#6f84a8;--lcd:#9daa86;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.hud{padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.brand{font-family:'Orbitron';color:var(--cyan);letter-spacing:2px;font-size:13px}
.btn{font-family:'Rajdhani';font-weight:700;background:var(--glass);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:20px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:8px 10px}
.label{font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.val{font-family:'IBM Plex Mono';font-size:16px}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:4px;overflow:hidden}.fill{height:100%;transition:width .4s}
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:380px}
.capsule{position:relative;width:280px;height:280px;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;inset:0;clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);border:2px solid var(--border);animation:spin 18s linear infinite}
.ring.evo{border-color:var(--amber);box-shadow:0 0 60px rgba(255,179,0,.6) inset;animation:spin 2s linear infinite, pulse .4s infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{filter:brightness(1.8)}}
.lcd{width:210px;height:210px;background:linear-gradient(155deg,#1c2230,#0a0e16);border-radius:22px;padding:10px;z-index:2;cursor:pointer;position:relative}
.screen{width:100%;height:100%;background:var(--lcd);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#petCanvas{image-rendering:pixelated;image-rendering:crisp-edges;width:190px;height:190px}
.evoLay{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,179,0,.85),rgba(123,92,255,.85));display:none;align-items:center;justify-content:center;font-family:'Orbitron';font-size:16px;color:#fff;z-index:10}
.evoLay.show{display:flex}
.info{margin-top:8px;text-align:center;font-family:'IBM Plex Mono';font-size:11px;color:var(--dim)}
.msg{position:absolute;font-family:'Orbitron';font-weight:700;pointer-events:none;animation:float 1.4s forwards;z-index:20}
@keyframes float{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}
.dock{background:linear-gradient(180deg,rgba(12,20,36,.4),var(--panel));border-top:1px solid var(--border);padding:12px}
.scroll{display:flex;gap:10px;overflow-x:auto}
.act{flex:0 0 64px;height:68px;border:1px solid var(--border);background:var(--glass);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.modal{display:none;position:fixed;inset:0;background:rgba(2,5,12,.75);backdrop-filter:blur(3px);z-index:1000;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.box{width:100%;max-width:520px;max-height:82vh;background:var(--panel);border:1px solid var(--border);border-radius:22px 22px 0 0;padding:20px;overflow-y:auto}
.head{display:flex;justify-content:space-between;margin-bottom:16px}.close{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;cursor:pointer}
.petCat{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}.petCat button{padding:6px 12px;border-radius:16px;border:1px solid var(--border);background:var(--glass);color:var(--dim);font-weight:700;white-space:nowrap}
.petCat button.active{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#04101c}
.pGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pOpt{background:var(--glass);border:2px solid transparent;border-radius:12px;padding:6px;text-align:center;cursor:pointer}
.pOpt.sel{border-color:var(--cyan)}
.pOpt img{width:48px;height:48px;image-rendering:pixelated;background:var(--lcd);border-radius:6px;object-fit:contain}
</style>
</head>
<body>
<div class="hud">
  <div class="top"><div class="brand">💎 DIAMANTE VIVO</div><button class="btn" id="btnChoose">escolher</button></div>
  <div class="stats">
    <div class="card"><div class="label">Fome</div><div class="val" id="fomeV">00</div><div class="bar"><div class="fill" id="fomeB" style="background:var(--amber);width:0%"></div></div></div>
    <div class="card"><div class="label">Carinho</div><div class="val" id="carV">0%</div><div class="bar"><div class="fill" id="carB" style="background:var(--success);width:0%"></div></div></div>
    <div class="card"><div class="label">EVO</div><div class="val" id="evoV">Lv1</div><div class="bar"><div class="fill" style="background:var(--violet);width:100%"></div></div></div>
    <div class="card"><div class="label">Moedas</div><div class="val" id="moedV">0</div><div class="bar"><div class="fill" style="background:var(--cyan);width:100%"></div></div></div>
  </div>
</div>

<div class="stage" id="stage">
  <div class="capsule"><div class="ring" id="ring"></div>
    <div style="text-align:center;z-index:2">
      <div class="lcd" id="lcd"><div class="screen"><canvas id="petCanvas" width="190" height="190"></canvas><div class="evoLay" id="evoLay">EVOLUINDO...</div></div></div>
      <div class="info" id="info">escolha seu bichinho</div>
    </div>
  </div>
</div>

<div class="dock"><div class="scroll">
  <button class="act" id="aFood">🍔<span style="font-size:10px;color:var(--dim)">Comida</span></button>
  <button class="act" id="aCarinho">❤️<span style="font-size:10px;color:var(--dim)">Carinho</span></button>
  <button class="act" id="aPlay">🎮<span style="font-size:10px;color:var(--dim)">Brincar</span></button>
  <button class="act" id="aSleep">💤<span style="font-size:10px;color:var(--dim)">Dormir</span></button>
</div></div>

<div class="modal" id="mChoose"><div class="box"><div class="head"><span class="brand">ESCOLHER</span><button class="close" data-c="mChoose">×</button></div><div class="petCat" id="catBar"></div><div class="pGrid" id="pGrid"></div></div></div>
<div class="modal" id="mFood"><div class="box"><div class="head"><span class="brand">COMIDA</span><button class="close" data-c="mFood">×</button></div><div class="grid2" id="fGrid"></div></div></div>

<script type="module">
import { PERSONAGENS, CATEGORIAS, getPersonagem, getListaPorCategoria } from './personagens_v2.js';

const SAVE='diamante-v3';
let state = JSON.parse(localStorage.getItem(SAVE)||'null') || {petId:'diamante', fome:20, carinho:0, estagio:0, coins:50, anim:'idle', last:Date.now()};
const canvas=document.getElementById('petCanvas'), ctx=canvas.getContext('2d');
let sheetImg=null, sheetLoaded=false, frame=0, animTimer=null, curAnimFrames=[], curFrameIdx=0;
const FOODS=[{n:'Sushi',i:'🍣',f:-30,c:8,anim:'comer'},{n:'Bolo',i:'🍰',f:-22,c:10,anim:'feliz'},{n:'Ramen',i:'🍜',f:-28,c:7,anim:'comer'}];

function save(){localStorage.setItem(SAVE,JSON.stringify(state))}
function float(t,col){const s=document.getElementById('stage'),e=document.createElement('div');e.className='msg';e.style.color=col||'#00e5ff';e.style.left=(40+Math.random()*20)+'%';e.style.top='30%';e.textContent=t;s.appendChild(e);setTimeout(()=>e.remove(),1400)}

function loadSheet(){
  const pet=getPersonagem(state.petId); if(!pet) return;
  const est=pet.estagios[state.estagio];
  if(!est) return;
  sheetImg=new Image();
  sheetImg.onload=()=>{sheetLoaded=true; setupAnim(est.anims[state.anim]||est.anims.idle)};
  sheetImg.onerror=()=>{sheetLoaded=false};
  sheetImg.src=est.sheet;
}
function setupAnim(frames){
  curAnimFrames=frames||[0]; curFrameIdx=0;
}
function draw(){
  if(!sheetImg||!sheetLoaded){ctx.clearRect(0,0,190,190); return}
  const pet=getPersonagem(state.petId); const est=pet.estagios[state.estagio];
  const cols=est.cols, rows=est.rows;
  const totalFrames=cols*rows;
  const idx = curAnimFrames[curFrameIdx % curAnimFrames.length] % totalFrames;
  const col = idx % cols, row = Math.floor(idx / cols);
  const fw = sheetImg.width / cols, fh = sheetImg.height / rows;
  ctx.clearRect(0,0,190,190);
  ctx.drawImage(sheetImg, col*fw, row*fh, fw, fh, 0, 0, 190, 190);
}

function startLoop(){
  if(animTimer) clearInterval(animTimer);
  animTimer=setInterval(()=>{curFrameIdx++; if(curFrameIdx>=curAnimFrames.length*3){ // troca anim idle depois
    const pet=getPersonagem(state.petId); if(state.anim!=='idle'){ state.anim='idle'; setupAnim(pet.estagios[state.estagio].anims.idle); save(); }
  } draw();}, 180);
}
function setAnim(name){
  const pet=getPersonagem(state.petId); if(!pet) return;
  const est=pet.estagios[state.estagio];
  state.anim=name;
  setupAnim(est.anims[name]||est.anims.idle);
}

function checkEvo(){
  const pet=getPersonagem(state.petId); if(!pet) return;
  if(state.carinho>=pet.carinhoParaEvoluir){
    if(state.estagio < pet.estagios.length-1){
      document.getElementById('ring').classList.add('evo');
      document.getElementById('evoLay').classList.add('show');
      float('EVOLUINDO!!!','var(--amber)');
      setTimeout(()=>{
        state.estagio++; state.carinho=0; state.anim='idle';
        document.getElementById('ring').classList.remove('evo');
        document.getElementById('evoLay').classList.remove('show');
        float(`VIROU ${pet.estagios[state.estagio].nome.toUpperCase()}!`,'var(--success)');
        loadSheet(); render();
      },2200);
    } else { float('MAXIMO!','var(--violet)'); state.carinho=100; }
  }
}
function render(){
  document.getElementById('fomeV').textContent=String(Math.round(state.fome)).padStart(2,'0');
  document.getElementById('fomeB').style.width=Math.min(100,state.fome)+'%';
  document.getElementById('carV').textContent=Math.round(state.carinho)+'%';
  document.getElementById('carB').style.width=state.carinho+'%';
  document.getElementById('moedV').textContent=state.coins;
  const pet=getPersonagem(state.petId);
  document.getElementById('btnChoose').textContent=pet?`${pet.name} • ${pet.estagios[state.estagio].nome}`:'escolher';
  document.getElementById('evoV').textContent=`Lv${state.estagio+1}`;
  document.getElementById('info').textContent=pet?`Carinho ${Math.round(state.carinho)}% para ${pet.estagios[state.estagio+1]?.nome||'MAX'}`:'escolha';
  // foods
  const g=document.getElementById('fGrid'); g.innerHTML='';
  FOODS.forEach(f=>{
    const d=document.createElement('div'); d.className='tile';
    d.innerHTML=`<div style="font-size:32px">${f.i}</div><div style="font-weight:700">${f.n}</div><div style="font-size:11px;color:var(--success)">+${f.c}% carinho</div>`;
    d.onclick=()=>{state.fome=Math.max(0,state.fome+f.f); state.carinho=Math.min(100,state.carinho+f.c); setAnim(f.anim); float(`+${f.c}%`,'var(--success)'); checkEvo(); render(); close('mFood')};
    g.appendChild(d);
  });
  save();
}
function open(id){document.getElementById(id).classList.add('show')}
function close(id){document.getElementById(id).classList.remove('show')}
document.getElementById('btnChoose').onclick=()=>{open('mChoose'); buildChoose()};
document.getElementById('aFood').onclick=()=>open('mFood');
document.getElementById('aCarinho').onclick=()=>{state.carinho=Math.min(100,state.carinho+7); setAnim('carinho'); float('+7% ❤️','var(--danger)'); checkEvo(); render()};
document.getElementById('aPlay').onclick=()=>{state.carinho=Math.min(100,state.carinho+10); setAnim('brincar'); float('BRINCANDO!','var(--violet)'); checkEvo(); render()};
document.getElementById('aSleep').onclick=()=>{setAnim('dormir'); float('Zzz...','var(--dim)'); render()};
document.getElementById('lcd').onclick=()=>{state.carinho=Math.min(100,state.carinho+3); setAnim('feliz'); float('❤️','var(--danger)'); checkEvo(); render()};
document.querySelectorAll('.close').forEach(b=>b.onclick=()=>close(b.dataset.c));
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m) m.classList.remove('show')}));

function buildChoose(){
  const bar=document.getElementById('catBar'); bar.innerHTML='';
  Object.keys(CATEGORIAS).forEach(c=>{
    const b=document.createElement('button'); b.textContent=CATEGORIAS[c]; b.onclick=()=>buildChooseCat(c); bar.appendChild(b);
  });
  buildChooseCat('cyber');
}
function buildChooseCat(cat){
  const grid=document.getElementById('pGrid'); grid.innerHTML='';
  getListaPorCategoria(cat).forEach(p=>{
    const o=document.createElement('div'); o.className='pOpt'+(state.petId===p.id?' sel':'');
    const img=document.createElement('img'); img.src=p.estagios[0].sheet; // preview
    o.appendChild(img);
    const lb=document.createElement('div'); lb.style.fontSize='9px'; lb.style.color='#6f84a8'; lb.textContent=p.name; o.appendChild(lb);
    o.onclick=()=>{state.petId=p.id; state.estagio=0; state.carinho=0; state.anim='idle'; loadSheet(); render(); close('mChoose')};
    grid.appendChild(o);
  });
}
loadSheet(); startLoop(); render();
setInterval(()=>{state.fome=Math.min(99,state.fome+0.2); render()},15000);
</script>
</body>
</html>
