<style>
:root{ --bg-deep:#050810; --bg-panel:#0c1424; --cyan:#00e5ff; --violet:#7b5cff; --amber:#ffb300; --danger:#ff3d5a; --success:#00e676; --glass:rgba(120,180,255,0.06); --glass-border:rgba(0,229,255,0.28); --text:#eaf6ff; --text-dim:#6f84a8; --lcd-bg:#9daa86; --font-display:'Orbitron',sans-serif; --font-body:'Rajdhani',sans-serif; --font-mono:'IBM Plex Mono',monospace; }

.bar-track{height:4px;background:rgba(255,255,255,0.08);border-radius:2px;margin-top:5px;overflow:hidden;} .bar-fill{height:100%;border-radius:2px;transition:width .4s ease;}

.pet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;} .pet-opt{background:var(--glass);border:2px solid transparent;border-radius:12px;padding:6px 4px;text-align:center;cursor:pointer;} .pet-opt.selected{border-color:var(--cyan);background:rgba(0,229,255,0.1);} .pet-opt canvas{display:block;margin:0 auto;background:var(--lcd-bg);border-radius:6px;image-rendering:pixelated;} .pet-opt-name{font-size:9px;color:var(--text-dim);margin-top:3px;display:block;}
.letter-card{background:linear-gradient(150deg,rgba(255,179,0,0.12),rgba(123,92,255,0.08));border:1px solid var(--glass-border);border-radius:16px;padding:22px;text-align:center;} .letter-emoji{font-size:46px;margin-bottom:10px;} .letter-text{font-size:15px;line-height:1.5;margin-bottom:16px;} .claim-btn{background:var(--success);border:none;color:#04180c;font-weight:700;padding:10px 28px;border-radius:22px;cursor:pointer;}
.code-group{display:flex;gap:8px;margin-bottom:14px;} .code-input{flex:1;background:var(--glass);border:1px solid var(--glass-border);color:var(--text); padding:12px;border-radius:12px;font-family:var(--font-mono);font-size:16px;text-align:center;letter-spacing:3px;text-transform:uppercase;} .code-submit{background:linear-gradient(135deg,var(--cyan),var(--violet));border:none;color:#04101c;font-weight:700;padding:0 20px;border-radius:12px;cursor:pointer;}
.code-result{padding:12px;border-radius:12px;text-align:center;font-weight:700;font-size:13px;} .code-success{background:rgba(0,230,118,0.15);color:var(--success);} .code-error{background:rgba(255,61,90,0.15);color:var(--danger);}
.game-canvas{width:100%;height:260px;border-radius:16px;background:#020509;border:1px solid var(--glass-border);} .game-hud{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin:10px 0;} .game-msg{text-align:center;font-family:var(--font-display);font-size:13px;color:var(--cyan);margin-top:10px;} .start-btn{width:100%;margin-top:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));border:none;color:#04101c;font-weight:700;padding:12px;border-radius:14px;cursor:pointer;}
</style>

<script type="module">
import { PETS, SPRITES, CAT_LABELS, findPet, petSpriteBitmap } from './personagens_final.js';

const FOODS = [ {id:'sushi',name:'Sushi',icon:'🍣',fome:-30,carinho:8},{id:'bolo',name:'Bolo',icon:'🍰',fome:-22,carinho:10},{id:'maca',name:'Maçã',icon:'🍎',fome:-12,carinho:5},{id:'ramen',name:'Ramen',icon:'🍜',fome:-28,carinho:7},{id:'pizza',name:'Pizza',icon:'🍕',fome:-25,carinho:8},{id:'sorvete',name:'Sorvete',icon:'🍦',fome:-15,carinho:6}, ];
const SHOP = [ {id:'chapeu',name:'Chapéu Holográfico',icon:'🎩',price:40},{id:'oculos',name:'Óculos Cyber',icon:'🕶️',price:35},{id:'aura',name:'Aura Diamante',icon:'✨',price:80},{id:'capa',name:'Capa Neon',icon:'🧣',price:50},{id:'coroa',name:'Coroa de Bytes',icon:'👑',price:120}, ];
const LETTERS = [ {emoji:'💌',text:'Transmissão criptografada com moedas.',coins:15},{emoji:'📦',text:'Pacote de manutenção com moedas extras.',coins:25},{emoji:'🎉',text:'Aniversário do seu bichinho! Bônus chegou.',coins:30},{emoji:'⚠️',text:'Só confete digital dessa vez.',coins:0}, ];
const CODES = { 'DIAMANTE': {msg:'Código mestre +100 moedas.', coins:100}, 'PENDRIVE': {msg:'Comida secreta +20 moedas!', coins:20}, 'ALMA2026': {msg:'Bônus laboratório +50 moedas!', coins:50}, };

const SAVE_KEY='diamante-vivo-save-v2';
function defaultState(){ return { petId:null, estagio:0, fome:20, carinho:0, felicidade:80, doente:false, poop:false, coins:30, bornAt:Date.now(), lastTick:Date.now(), mailPending:true, itemsOwned:[], }; }
function loadState(){ try{ const raw=localStorage.getItem(SAVE_KEY); if(!raw) return defaultState(); return Object.assign(defaultState(), JSON.parse(raw)); }catch(e){ return defaultState(); } }
function saveState(){ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
let state=loadState();

function drawSprite(ctx, bitmap, px, offX, offY, color){ ctx.save(); ctx.translate(offX, offY); ctx.fillStyle=color; for(let r=0;r<bitmap.length;r++){ const row=bitmap[r]; for(let c=0;c<row.length;c++){ if(row[c]==='#') ctx.fillRect(c*px, r*px, px, px); } } ctx.restore(); }
function makeMiniCanvas(spriteId, size){ const cvs=document.createElement('canvas'); cvs.width=size; cvs.height=size; const ctx=cvs.getContext('2d'); const px=size/16; drawSprite(ctx, petSpriteBitmap(spriteId), px, 0, 0, '#2a2f20'); return cvs; }
let petCtx=null, bounce=false, animTimer=null;
function startPetAnimation(){ const canvas=document.getElementById('petCanvas'); petCtx=canvas.getContext('2d'); if(animTimer) clearInterval(animTimer); animTimer=setInterval(()=>{ bounce=!bounce; drawPetFrame(); }, 450); drawPetFrame(); }
function drawPetFrame(){
  if(!petCtx) return; const canvas=petCtx.canvas; petCtx.clearRect(0,0,canvas.width,canvas.height);
  const pet=findPet(state.petId);
  let spriteId='egg';
  if(pet){ const est=pet.estagios[state.estagio]||pet.estagios[0]; spriteId=est.sprite; }
  const bitmap=petSpriteBitmap(spriteId); const px=canvas.width/16;
  let offY=bounce?-4:0; let offX=state.doente?(bounce?-3:3):0;
  drawSprite(petCtx, bitmap, px, offX, offY, '#2a2f20');
}
function getCurrentEstagio(){ const pet=findPet(state.petId); if(!pet) return null; return pet.estagios[state.estagio]||pet.estagios[0]; }

function render(){
  document.getElementById('fomeVal').textContent=String(Math.round(state.fome)).padStart(2,'0');
  document.getElementById('fomeBar').style.width=Math.min(100,state.fome)+'%';
  document.getElementById('carinhoVal').textContent=Math.round(state.carinho)+'%';
  document.getElementById('carinhoBar').style.width=Math.min(100,state.carinho)+'%';
  document.getElementById('felizBar').style.width=Math.min(100,state.felicidade)+'%';
  document.getElementById('moedasVal').textContent=state.coins;
  const days=Math.max(0, Math.floor((Date.now()-state.bornAt)/(1000*60*60*24))); const hours=Math.floor(((Date.now()-state.bornAt)/(1000*60*60))%24);
  document.getElementById('evoVal').textContent='Lv'+(state.estagio+1);
  const pet=findPet(state.petId);
  document.getElementById('petNameBtn').textContent=pet?`${pet.name} • ${getCurrentEstagio()?.nome||''}`:'escolher';
  if(!petCtx) startPetAnimation(); else drawPetFrame();
  const needs=state.fome>=70||state.doente||state.poop;
  document.getElementById('facetRing').classList.toggle('alarm', needs);
  document.getElementById('poopBadge').style.display=state.poop?'block':'none';
  document.getElementById('sickBadge').style.display=state.doente?'block':'none';
  document.getElementById('mailBadge').style.display=state.mailPending?'block':'none';
  const chip=document.getElementById('statusChip');
  if(state.doente) chip.textContent='doente — precisa de remédio';
  else if(state.fome>=70) chip.textContent='faminto';
  else if(state.poop) chip.textContent='sujeira no chão';
  else if(pet){ const next=pet.estagios[state.estagio+1]; chip.textContent=next?`${Math.round(state.carinho)}% para evoluir para ${next.nome}`:`${pet.name} no máximo!`; }
  else chip.textContent='estável';
  renderFoodGrid(); renderShop(); renderPetSelector(currentCat);
  saveState();
}

function tick(){ const now=Date.now(); const mins=(now-state.lastTick)/60000; state.lastTick=now; if(mins<=0) return; state.fome=Math.min(99, state.fome+mins*1.1); state.felicidade=Math.max(0, state.felicidade-mins*0.6); if(state.fome>=90&&!state.doente&&Math.random()<0.02*mins) state.doente=true; if(!state.poop&&Math.random()<0.01*mins) state.poop=true; if(!state.mailPending&&Math.random()<0.004*mins) state.mailPending=true; render(); }
setInterval(tick,15000);

function floatMsg(text,color){ const stage=document.getElementById('stage'); const el=document.createElement('div'); el.className='floating-msg'; el.style.color=color||'var(--cyan)'; el.style.left=(40+Math.random()*20)+'%'; el.style.top='35%'; el.textContent=text; stage.appendChild(el); setTimeout(()=>el.remove(),1400); }

function checkEvolucao(){
  const pet=findPet(state.petId); if(!pet) return;
  if(state.carinho>= (pet.carinhoParaEvoluir||100)){
    if(state.estagio < pet.estagios.length-1){
      const ring=document.getElementById('facetRing'); const overlay=document.getElementById('evoOverlay');
      ring.classList.add('evolving'); overlay.classList.add('show');
      floatMsg('EVOLUINDO!!!','var(--amber)');
      setTimeout(()=>{
        state.estagio++; state.carinho=0;
        ring.classList.remove('evolving'); overlay.classList.remove('show');
        floatMsg(`VIROU ${getCurrentEstagio().nome.toUpperCase()}!`,'var(--success)');
        render();
      }, 1800);
    } else {
      floatMsg('NÍVEL MÁXIMO!','var(--violet)'); state.carinho=100;
    }
  }
}

function petTap(){ if(!state.petId){ openModal('selector'); return; } state.felicidade=Math.min(100, state.felicidade+2); state.carinho=Math.min(100, state.carinho+3); floatMsg('❤️','var(--danger)'); checkEvolucao(); render(); }
function cleanPoop(){ if(!state.poop){ floatMsg('tudo limpo','var(--text-dim)'); return; } state.poop=false; state.felicidade=Math.min(100, state.felicidade+3); state.carinho=Math.min(100, state.carinho+2); floatMsg('+limpeza','var(--success)'); checkEvolucao(); render(); }
function giveMedicine(){ if(!state.doente){ floatMsg('sem febre','var(--text-dim)'); return; } state.doente=false; state.felicidade=Math.max(0, state.felicidade-5); floatMsg('curado!','var(--success)'); render(); }
function renderFoodGrid(){ const grid=document.getElementById('foodGrid'); grid.innerHTML=''; FOODS.forEach(f=>{ const t=document.createElement('div'); t.className='tile'; t.innerHTML=`<div class="tile-icon">${f.icon}</div><div class="tile-name">${f.name}</div><div class="tile-sub">fome ${f.fome} +${f.carinho}% carinho</div>`; t.onclick=()=>{ state.fome=Math.max(0, state.fome+f.fome); state.felicidade=Math.min(100, state.felicidade+3); state.carinho=Math.min(100, state.carinho+f.carinho); floatMsg('nham!','var(--amber)'); checkEvolucao(); render(); closeModal('food'); }; grid.appendChild(t); }); }
function renderShop(){ const list=document.getElementById('shopList'); list.innerHTML=''; SHOP.forEach(item=>{ const owned=state.itemsOwned.includes(item.id); const row=document.createElement('div'); row.className='shop-row'; row.innerHTML=`<div class="shop-icon">${item.icon}</div><div class="shop-info"><div class="shop-name">${item.name}</div><div class="shop-price">${owned?'adquirido':item.price+' moedas'}</div></div><button class="buy-btn" ${owned||state.coins<item.price?'disabled':''}>${owned?'✓':'Comprar'}</button>`; row.querySelector('button').onclick=()=>{ if(owned||state.coins<item.price) return; state.coins-=item.price; state.itemsOwned.push(item.id); state.felicidade=Math.min(100, state.felicidade+8); state.carinho=Math.min(100, state.carinho+8); floatMsg('novo item!','var(--violet)'); checkEvolucao(); render(); }; list.appendChild(row); }); }
function openMail(){ const body=document.getElementById('mailBody'); if(!state.mailPending){ body.innerHTML=`<div class="letter-card"><div class="letter-emoji">📭</div><div class="letter-text">Caixa vazia por enquanto.</div></div>`; return; } const letter=LETTERS[Math.floor(Math.random()*LETTERS.length)]; body.innerHTML=`<div class="letter-card"><div class="letter-emoji">${letter.emoji}</div><div class="letter-text">${letter.text}</div><button class="claim-btn" id="claimBtn">${letter.coins>0?'Resgatar +'+letter.coins:'Fechar'}</button></div>`; document.getElementById('claimBtn').onclick=()=>{ state.coins+=letter.coins; state.mailPending=false; render(); closeModal('mail'); }; }
function redeemCode(){ const input=document.getElementById('codeInput'); const code=input.value.trim().toUpperCase(); const result=document.getElementById('codeResult'); const found=CODES[code]; if(found){ state.coins+=found.coins; result.innerHTML=`<div class="code-result code-success">${found.msg}</div>`; render(); } else { result.innerHTML=`<div class="code-result code-error">Código inválido.</div>`; } input.value=''; }

let currentCat='comuns';
function renderPetSelector(cat){ currentCat=cat; const bar=document.getElementById('petCatBar'); bar.innerHTML=''; Object.keys(PETS).forEach(c=>{ const b=document.createElement('button'); b.textContent=CAT_LABELS[c]; b.className=c===cat?'active':''; b.onclick=()=>renderPetSelector(c); bar.appendChild(b); }); const grid=document.getElementById('petGrid'); grid.innerHTML=''; PETS[cat].forEach(p=>{ const opt=document.createElement('div'); opt.className='pet-opt'+(state.petId===p.id?' selected':''); const mini=makeMiniCanvas(p.estagios[0].sprite, 48); opt.appendChild(mini); const label=document.createElement('span'); label.className='pet-opt-name'; label.textContent=p.name; opt.appendChild(label); opt.onclick=()=>{ state.petId=p.id; state.estagio=0; state.carinho=0; if(!state.bornAt||state.bornAt===0) state.bornAt=Date.now(); render(); closeModal('selector'); floatMsg('bem-vindo!','var(--cyan)'); }; grid.appendChild(opt); }); }

let gameCtx, gameRAF, gameRunning=false, gameScore=0, gameTimeLeft=20, items=[], playerX=0.5;
function setupCanvas(){ const c=document.getElementById('gameCanvas'); c.width=c.clientWidth; c.height=c.clientHeight; gameCtx=c.getContext('2d'); c.onpointermove=(e)=>{ if(!gameRunning) return; const r=c.getBoundingClientRect(); playerX=Math.min(1, Math.max(0, (e.clientX-r.left)/r.width)); }; }
function startGame(){ if(gameRunning) return; setupCanvas(); gameRunning=true; gameScore=0; gameTimeLeft=20; items=[]; playerX=0.5; document.getElementById('gameStartBtn').textContent='Jogando...'; document.getElementById('gameMsg').textContent=''; const timer=setInterval(()=>{ gameTimeLeft--; document.getElementById('gameTime').textContent='Tempo: '+gameTimeLeft+'s'; if(gameTimeLeft<=0){ clearInterval(timer); endGame(); } },1000); gameLoop(); }
function endGame(){ gameRunning=false; cancelAnimationFrame(gameRAF); const earned=Math.floor(gameScore/2); state.coins+=earned; state.felicidade=Math.min(100, state.felicidade+Math.min(20, gameScore)); state.carinho=Math.min(100, state.carinho+Math.min(20, gameScore)); document.getElementById('gameMsg').textContent=`Fim! Pontos: ${gameScore} → +${earned} moedas + carinho.`; document.getElementById('gameStartBtn').textContent='Jogar de novo'; checkEvolucao(); render(); }
function gameLoop(){ const c=document.getElementById('gameCanvas'); const w=c.width,h=c.height; gameCtx.clearRect(0,0,w,h); gameCtx.fillStyle='#020509'; gameCtx.fillRect(0,0,w,h); gameCtx.strokeStyle='rgba(0,229,255,0.15)'; for(let i=0;i<w;i+=24){ gameCtx.beginPath(); gameCtx.moveTo(i,0); gameCtx.lineTo(i,h); gameCtx.stroke(); } if(Math.random()<0.045){ items.push({x:Math.random()*w, y:-10, speed:2+Math.random()*2}); } const pet=findPet(state.petId); const spriteId=pet? (pet.estagios[state.estagio]?.sprite||pet.estagios[0].sprite):'egg'; const bitmap=petSpriteBitmap(spriteId); const px=playerX*w; drawSprite(gameCtx, bitmap, 2.2, px-16*2.2/2, h-40, '#00e5ff'); items.forEach(it=>{ it.y+=it.speed; gameCtx.fillStyle='#ffb300'; gameCtx.beginPath(); gameCtx.arc(it.x, it.y, 7, 0, Math.PI*2); gameCtx.fill(); if(Math.abs(it.x-px)<26 && Math.abs(it.y-(h-30))<26){ it.caught=true; gameScore+=10; document.getElementById('gameScore').textContent='Pontos: '+gameScore; } }); items=items.filter(it=>!it.caught&&it.y<h+20); if(gameRunning) gameRAF=requestAnimationFrame(gameLoop); }

function openModal(name){ document.getElementById('modal-'+name).classList.add('show'); if(name==='mail') openMail(); if(name==='selector') renderPetSelector(currentCat); if(name==='codes'){ document.getElementById('codeResult').innerHTML=''; } }
function closeModal(name){ document.getElementById('modal-'+name).classList.remove('show'); if(name==='game'){ gameRunning=false; cancelAnimationFrame(gameRAF); document.getElementById('gameStartBtn').textContent='Começar'; } }
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
document.querySelectorAll('.modal').forEach(m=>{ m.addEventListener('click',(e)=>{ if(e.target===m) m.classList.remove('show'); }); });
document.getElementById('petNameBtn').onclick=()=>openModal('selector');
document.getElementById('btnFood').onclick=()=>openModal('food');
document.getElementById('btnClean').onclick=()=>cleanPoop();
document.getElementById('btnGame').onclick=()=>openModal('game');
document.getElementById('btnShop').onclick=()=>openModal('shop');
document.getElementById('btnMed').onclick=()=>giveMedicine();
document.getElementById('btnMail').onclick=()=>openModal('mail');
document.getElementById('btnCodes').onclick=()=>openModal('codes');
document.getElementById('lcdShell').onclick=()=>petTap();
document.getElementById('gameStartBtn').onclick=()=>startGame();
document.getElementById('codeSubmit').onclick=()=>redeemCode();

if(!state.petId){ setTimeout(()=>openModal('selector'), 400); }
render(); tick();
</script>
</body>
</html>
